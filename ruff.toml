target-version = "py312"
line-length = 100
extend-exclude = [
  ".experiences",
  ".traces",
  ".agent_index",
  ".agent_checkpoints",
  ".evolution",
  ".sessions",
  "__pycache__",
]

[lint]
# Conservative baseline: catch syntax/runtime-fatal issues without blocking on
# the legacy style backlog. Contributors may run a wider rule set locally.
select = ["E9", "F63", "F7", "F82"]
